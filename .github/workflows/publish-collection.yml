name: Publish collection edition

on:
  push:
    branches: [main]
    paths:
      - gradle.properties
      - .github/workflows/publish-collection.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'TomerBaranes/Kotoba-Keep'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: ./gradlew build
      - name: Package mod and checksum
        id: package
        shell: bash
        run: |
          version=$(sed -n 's/^mod_version=//p' gradle.properties | tr -d '\r')
          minecraft=$(sed -n 's/^minecraft_version=//p' gradle.properties | tr -d '\r')
          [[ "$version" == *collection* ]] || { echo 'Expected a collection edition version'; exit 1; }
          name="kotoba-keep-$version+$minecraft.jar"
          mkdir dist
          cp "build/libs/kotoba-keep-$version.jar" "dist/$name"
          (cd dist && sha256sum "$name" > "$name.sha256")
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: collection-release
          path: dist/
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: collection-release
          path: dist/
      - name: Publish version once
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          TARGET: ${{ github.sha }}
        run: |
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; increase mod_version for a new release."
            exit 0
          fi
          gh release create "$tag" dist/* --target "$TARGET" \
            --title "Kotoba Keep $VERSION — Collection Edition" \
            --notes-file .github/release-notes.md --latest
